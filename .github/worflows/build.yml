name: OnePlus Universal Kernel Builder

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: Choose one device, several devices, or every supported device
        required: true
        type: choice
        options:
          - Single Device
          - Multiple Devices
          - All Supported Devices
        default: Single Device

      device:
        description: Select one device when using Single Device mode
        required: false
        type: choice
        options:
          - OnePlus 10 Pro
          - OnePlus 10T
          - OnePlus 11
          - OnePlus 11R
          - OnePlus 12
          - OnePlus 12R
          - OnePlus 13
          - OnePlus 13R
          - OnePlus 15
          - OnePlus Ace 2
          - OnePlus Ace 2V
          - OnePlus Ace 2 Pro
          - OnePlus Ace 3
          - OnePlus Ace 3V
          - OnePlus Ace 3 Pro
          - OnePlus Ace 5
          - OnePlus Ace 5 Pro
        default: OnePlus 13R

      devices:
        description: "Comma-separated device IDs for Multiple Devices mode (example: oneplus11,oneplus12,oneplus13r)"
        required: false
        type: string
        default: oneplus11,oneplus12,oneplus13

      sukisu:
        description: SukiSU kernel integration
        required: true
        type: choice
        options:
          - Enable
          - Disable
        default: Enable

      susfs:
        description: SUSFS support. Auto Detect is recommended.
        required: true
        type: choice
        options:
          - Auto Detect
          - Enable
          - Disable
        default: Auto Detect

      kpm:
        description: Kernel Patch Module support. Auto Detect is recommended.
        required: true
        type: choice
        options:
          - Auto Detect
          - Enable
          - Disable
        default: Auto Detect

      compiler_optimization:
        description: Compiler optimization level. Auto Detect is recommended.
        required: true
        type: choice
        options:
          - Auto Detect
          - O2
          - O3
          - Oz
        default: Auto Detect

      bbr:
        description: TCP BBR. Auto Detect is recommended.
        required: true
        type: choice
        options:
          - Auto Detect
          - Enable
          - Disable
        default: Auto Detect

      bbrv3:
        description: BBRv3. Only enable when supported by the selected kernel.
        required: true
        type: choice
        options:
          - Auto Detect
          - Enable
          - Disable
        default: Auto Detect

      netsync:
        description: NTSYNC/NetSync support. Auto Detect is recommended.
        required: true
        type: choice
        options:
          - Auto Detect
          - Enable
          - Disable
        default: Auto Detect

      ccache:
        description: "Clean Build disables CCache; Use CCache speeds up repeat builds."
        required: true
        type: choice
        options:
          - Clean Build (No CCache)
          - Use CCache
        default: Use CCache

permissions:
  contents: read

concurrency:
  group: kernel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DEVICE_INPUT: ${{ inputs.device }}

jobs:
  resolve:
    name: Resolve Devices
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install YAML parser
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml

      - name: Convert Device Selection
        id: normalize-device
        env:
          DEVICE_NAME: ${{ inputs.device }}
        run: |
          python3 - <<'PY'
          import os
          mapping = {
              "OnePlus 10 Pro": "oneplus10pro",
              "OnePlus 10T": "oneplus10t",
              "OnePlus 11": "oneplus11",
              "OnePlus 11R": "oneplus11r",
              "OnePlus 12": "oneplus12",
              "OnePlus 12R": "oneplus12r",
              "OnePlus 13": "oneplus13",
              "OnePlus 13R": "oneplus13r",
              "OnePlus 15": "oneplus15",
              "OnePlus Ace 2": "ace2",
              "OnePlus Ace 2V": "ace2v",
              "OnePlus Ace 2 Pro": "ace2pro",
              "OnePlus Ace 3": "ace3",
              "OnePlus Ace 3V": "ace3v",
              "OnePlus Ace 3 Pro": "ace3pro",
              "OnePlus Ace 5": "ace5",
              "OnePlus Ace 5 Pro": "ace5pro",
          }
          name = os.environ["DEVICE_NAME"]
          value = mapping.get(name, name.strip().lower())
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"device_id={value}\n")
          PY

      - name: Resolve selected devices
        id: resolve
        env:
          BUILD_MODE: ${{ inputs.build_mode }}
          DEVICE: ${{ steps.normalize-device.outputs.device_id }}
          DEVICES: ${{ inputs.devices }}
        run: |
          python3 scripts/resolve_devices.py \
            --mode "$BUILD_MODE" \
            --device "$DEVICE" \
            --devices "$DEVICES" \
            --config configs/devices.yml

  build:
    name: Build ${{ matrix.device }}
    needs: resolve
    if: needs.resolve.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        device: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      DEVICE: ${{ matrix.device }}
      SUKISU: ${{ inputs.sukisu }}
      SUSFS: ${{ inputs.susfs }}
      KPM: ${{ inputs.kpm }}
      BBR: ${{ inputs.bbr }}
      BBRV3: ${{ inputs.bbrv3 }}
      NETSYNC: ${{ inputs.netsync }}
      OPTIMIZATION: ${{ inputs.compiler_optimization }}
      CCACHE_MODE: ${{ inputs.ccache }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache clang flex \
            gcc-aarch64-linux-gnu git libelf-dev libssl-dev \
            lld llvm make python3 python3-yaml rsync unzip wget xz-utils \
            pahole curl zip repo

      - name: Resolve device profile
        run: |
          python3 scripts/device.py \
            --device "$DEVICE" \
            --config configs/devices.yml \
            --output "$RUNNER_TEMP/device.env"
          cat "$RUNNER_TEMP/device.env" >> "$GITHUB_ENV"

      - name: Sync official OnePlus manifest
        run: bash scripts/prepare.sh

      - name: Detect kernel layout
        run: bash scripts/detect.sh

      - name: Restore CCache
        if: inputs.ccache == 'Use CCache'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ matrix.device }}-${{ hashFiles('configs/devices.yml') }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ matrix.device }}-

      - name: Configure root and kernel features
        run: bash scripts/features.sh

      - name: Build
        run: bash scripts/build.sh

      - name: Verify
        run: bash scripts/verify.sh

      - name: Package
        run: bash scripts/package.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: out/${{ env.ARTIFACT_NAME }}
          if-no-files-found: error
          retention-days: 14
